spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/civis}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:${PGUSER:postgres}}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:${PGPASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
app.auth.expose-otp=${AUTH_EXPOSE_OTP:false}
app.admin.emails=${ADMIN_EMAILS:}
app.admin.mobiles=${ADMIN_MOBILES:}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:None}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://civis-omega.vercel.app,https://*.vercel.app,http://localhost:*,http://127.0.0.1:*}
